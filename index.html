<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineholic</title>
    <link rel="manifest" href="./manifest.json" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; 
               img-src 'self' data: https://image.tmdb.org; 
               script-src 'self' https://apis.google.com; 
               style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; 
               font-src 'self' https://fonts.gstatic.com; 
               connect-src 'self' https://api.themoviedb.org;"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&family=Lustria&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./js/main.js" type="module"></script>
  </head>
  <body id="index-html">
    <header class="navbar">
      <div class="logo">
        <div class="container">
          <a href="./index.html"
            ><img src="./images/Movie-appLogo.svg" alt="displaying the logo"
          /></a>
        </div>
      </div>
      <nav class="navbar__nav">
        <ul class="navbar__list">
          <li>
            <a href="./cart.html" class="navbar-link">
              <div class="cart-icon">
                <div></div>
                <img src="./images/Cart.svg" alt="image displaying cart icon" />
              </div>
              <div>
                <p class="cart-label">Cart</p>
              </div>
            </a>
          </li>
          <li>
            <a href="./index.html" class="navbar-link">
              <div class="home-icon">
                <img src="./images/home.svg" alt="image displaying home icon" />
              </div>
              <div>
                <p class="cart-label">Home</p>
              </div>
            </a>
          </li>
          <li>
            <a href="./rent.html" class="navbar-link">
              <div class="rent-icon">
                <div></div>
                <img src="./images/Movie.svg" alt="img displaying rent icon" />
              </div>
              <div>
                <p class="cart-label">Rented</p>
              </div>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="main">
      <section id="welcome" class="welcome">
        <h1 class="welcome__title">Welcome to Cineholic!</h1>
        <p class="welcome__details">
          Search, find out information and rent movies all at once!
        </p>

        <form action="./index.html" class="search" id="search-form--one">
          <label for="search--one"></label>
          <input
            class="search-form__input"
            type="search"
            id="search--one"
            name="search"
          />
        </form>
      </section>

      <section id="search-results" class="search-results inactive">
        <div class="container">
          <div class="search-container">
            <form action="./index.html" class="search" id="search-form--two">
              <label for="search--two"></label>

              <input
                class="search-form__input search-form__input-modifier"
                type="search"
                id="search--two"
                name="search"
              />
            </form>
          </div>
          <ul class="user-card__list"></ul>
        </div>
      </section>
    </main>
    <div class="offline inactive"></div>
    <template id="card-template">
      <li>
        <div class="user-card">
          <div class="user-card__img">
            <img src="" alt="" />
          </div>
          <div class="user-card__content">
            <h3 class="user-card__name"></h3>
            <p class="user-card__rating">Rating:</p>
            <p class="user-card__description"></p>
            <a href="" class="btn btn-cart">Add to Cart</a>
          </div>
        </div>
      </li>
    </template>
  </body>
</html>
