<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineholic</title>
    <link rel="manifest" href="./manifest.json" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; 
               img-src 'self' data: https://image.tmdb.org; 
               script-src 'self' https://apis.google.com; 
               style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; 
               font-src 'self' https://fonts.gstatic.com; 
               connect-src 'self' https://api.themoviedb.org;"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&family=Lustria&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./js/main.js" type="module"></script>
  </head>

  <body id="view-html">
    <header class="navbar">
      <div class="logo">
        <div class="container">
          <a href="./index.html"
            ><img src="./images/Movie-appLogo.svg" alt="displaying the logo"
          /></a>
        </div>
      </div>
      <nav class="navbar__nav">
        <ul class="navbar__list">
          <li>
            <a href="./cart.html" class="navbar-link">
              <div class="cart-icon">
                <div></div>
                <img src="./images/Cart.svg" alt="image displaying cart icon" />
              </div>
              <div>
                <p class="cart-label">Cart</p>
              </div>
            </a>
          </li>
          <li>
            <a href="./index.html" class="navbar-link">
              <div class="home-icon">
                <img src="./images/home.svg" alt="image displaying home icon" />
              </div>
              <div>
                <p class="cart-label">Home</p>
              </div>
            </a>
          </li>
          <li>
            <a href="./rent.html" class="navbar-link">
              <div class="rent-icon">
                <div></div>
                <img src="./images/Movie.svg" alt="img displaying rent icon" />
              </div>
              <div>
                <p class="cart-label">Rented</p>
              </div>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="view container inactive">
        <h2 class="view-title">Movie Details</h2>
        <div class="movie">
          <div class="video">
            <video width="max" height="max" controls class="movie-player">
              <source src="./videos/placeholdervid.mp4" type="video/mp4" />
              <source src="movie.mp4" type="video/mp4" />
              <source src="movie.ogg" type="video/ogg" />
              Your browser does not support the video tag.
            </video>
          </div>
          <div class="details">
            <div class="movie-section">
              <h2 class="movie__title"></h2>

              <div class="movie__genre-list"></div>

              <div class="ratings"></div>
            </div>
            <div class="movie__summary">
              <h2>Plot Summary</h2>
              <p></p>
            </div>

            <div class="movie-details">
              <ul class="movie-details__list">
                <li class="adults">
                  <span class="info__text--bold">Adults only:</span
                  ><span class="info__text--normal"></span>
                </li>
                <li class="release">
                  <span class="info__text--bold">Release date:</span
                  ><span class="info__text--normal"></span>
                </li>
                <li></li>
                <li></li>
              </ul>
            </div>
            <a href="" class="btn btn-watched">Mark As Watched</a>
          </div>
        </div>
      </section>
      <section class="empty-msg inactive">
        <p>You have not rented this movie.</p>
        <img src="./images/empty-cart.svg" alt="empty cart" />
        <a href="./index.html" class="btn btn-watched">Continue Browsing</a>
      </section>
    </main>
    <div class="offline inactive"></div>
  </body>
</html>
