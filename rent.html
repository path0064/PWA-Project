<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cineholic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&family=Lustria&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./js/main.js" type="module"></script>
    <link rel="manifest" href="./manifest.json" />
  </head>
  <body id="rent-html">
    <header class="navbar">
      <div class="logo">
        <div class="container">
          <a href="./index.html"><img src="./images/Movie-appLogo.svg" /></a>
        </div>
      </div>
      <nav class="navbar__nav">
        <ul class="navbar__list">
          <li>
            <a href="./cart.html" class="navbar-link">
              <div class="cart-icon">
                <div></div>
                <img src="./images/Cart.svg" alt="image displaying cart icon" />
              </div>
              <div>
                <p class="cart-label">Cart</p>
              </div>
            </a>
          </li>
          <li>
            <a href="./index.html" class="navbar-link">
              <div class="home-icon">
                <img src="./images/home.svg" alt="image displaying home icon" />
              </div>
              <div>
                <p class="cart-label">Home</p>
              </div>
            </a>
          </li>
          <li>
            <a href="./rent.html" class="navbar-link">
              <div class="rent-icon">
                <div></div>
                <img src="./images/Movie.svg" alt="img displaying rent icon" />
              </div>
              <div>
                <p class="cart-label">Rented</p>
              </div>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- <div class="search-container">
          <form action="./search.html" class="search" id="search-form">
            <label for="search"></label>

            <input
              class="search-form__input search-form__input-modifier"
              type="search"
              id="search"
              name="search"
            />
          </form>
        </div> -->
      <section>
        <div class="container">
          <h2 class="rent-title">Rented</h2>
          <ul class="user-card__list"></ul>
        </div>
      </section>
      <section class="empty-msg">
        <p>Looks like you haven't added anything yet.</p>
        <img src="./images/rents-empty.svg" alt="empty cart" />
        <a href="./index.html" class="btn btn-watched">Continue Browsing</a>
      </section>
    </main>
    <div class="offline inactive"></div>
    <template id="card-template">
      <li>
        <div class="user-card">
          <div class="user-card__img">
            <img src="./images/s-l1200.jpg" alt="" />
          </div>
          <div class="user-card__content">
            <h3 class="user-card__name"></h3>
            <p class="user-card__rating">Rating:</p>
            <p class="user-card__description"></p>
            <div class="btn-group">
              <a class="btn btn-watch">Watch</a>
            </div>
          </div>
        </div>
      </li>
    </template>
  </body>
</html>
